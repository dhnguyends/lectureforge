# Local infrastructure for LectureForge. Start with: npm run infra:up
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lectureforge
      POSTGRES_PASSWORD: lectureforge
      POSTGRES_DB: lectureforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectureforge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  # S3-compatible object storage (SeaweedFS). The S3 API is exposed on
  # localhost:9000; credentials come from infra/seaweedfs/s3.json. The bucket
  # and its CORS rules are created by `npm run storage:init`.
  storage:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports: ["9000:8333"]
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Local speech-to-text (Whisper via faster-whisper), OpenAI-compatible API
  # on localhost:8000. Uses the NVIDIA GPU; models are cached in a volume.
  stt:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda
    ports: ["8000:8000"]
    environment:
      # int8 works well on older GPUs (e.g. Pascal) that lack fast fp16.
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__INFERENCE_DEVICE: auto
      # Keep the model loaded: loading it from the volume takes ~50 s on Docker
      # Desktop, which would stall voice input after every idle period. The turbo
      # model needs ~1.5 GB of VRAM, leaving room for Ollama on an 11 GB GPU.
      STT_MODEL_TTL: "-1"
    volumes: [sttmodels:/home/ubuntu/.cache/huggingface/hub]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional malware scanning: docker compose --profile scan up -d
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports: ["3310:3310"]

volumes:
  pgdata:
  redisdata:
  storagedata:
  sttmodels:
